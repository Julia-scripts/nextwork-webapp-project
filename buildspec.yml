version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
  pre_build:
    commands:
      - echo "Creating Maven settings..."
      - mkdir -p /root/.m2
      - |
        cat <<EOF > /root/.m2/settings.xml
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github</id>
              <username>julia-scripts</username>
              <password>$GITHUB_TOKEN</password>
            </server>
          </servers>
        </settings>
        EOF
  build:
    commands:
      - echo "Locating project folder..."
      - PROJECT_DIR=$(find . -name "pom.xml" -exec dirname {} \;)
      - echo "Moving into $PROJECT_DIR"
      - cd $PROJECT_DIR
      - echo "Starting Maven build..."
      - mvn clean package -DskipTests -s /root/.m2/settings.xml
artifacts:
  files:
    - '**/target/*.war'
  discard-paths: yes
