version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
  pre_build:
    commands:
      - echo "Checking Environment Variable..."
      - if [ -z "$GITHUB_TOKEN" ]; then echo "!! TOKEN IS MISSING IN AWS CONSOLE !!"; else echo "TOKEN IS FOUND"; fi
      - mkdir -p ~/.m2
      - |
        echo "<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd\">
          <servers>
            <server>
              <id>github</id>
              <username>Julia-scripts</username>
              <password>${GITHUB_TOKEN}</password>
            </server>
          </servers>
        </settings>" > ~/.m2/settings.xml
      - echo "Settings.xml created. Verifying structure (hiding password)..."
      - sed 's/<password>.*<\/password>/<password>****<\/password>/' ~/.m2/settings.xml
  build:
    commands:
      - echo "Starting Maven deploy..."
      - mvn deploy -DskipTests
  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - target/*.war
  discard-paths: yes
